
name: Build GeoSnap Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local web app files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#102b35' --splashBackgroundColor '#102b35'

      - name: Add camera and location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          entries = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'
          ]

          for entry in entries:
              if entry not in content:
                  match = re.search(r"\s*<application\b", content)
                  if not match:
                      raise SystemExit("Could not find application tag")
                  content = content[:match.start()] + "\n    " + entry + content[match.start():]

          manifest.write_text(content, encoding="utf-8")
          print("Camera and GPS permissions added.")
          PY

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoSnap-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
