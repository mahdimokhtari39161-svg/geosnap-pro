name: Build GeoSnap Pro Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local web app files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#102b35' --splashBackgroundColor '#102b35'

      - name: Add camera and location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          entries = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'
          ]

          for entry in entries:
              if entry not in content:
                  match = re.search(r"<application\b", content)
                  if not match:
                      raise SystemExit("Could not find application tag")
                  content = content[:match.start()] + "\n    " + entry + content[match.start():]

          manifest.write_text(content, encoding="utf-8")
          print("Camera and GPS permissions added.")
          PY

      - name: Decode and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          value = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64")

          # GitHub secret values may contain pasted line breaks; remove whitespace only.
          compact = re.sub(r"\s+", "", value)
          if not re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", compact):
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 contains characters outside the Base64 alphabet. "
                  "Re-create the secret from the complete Base64 clipboard value."
              )

          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 is incomplete or has invalid Base64 padding. "
                  "Re-copy the complete keystore Base64 value and replace the GitHub secret."
              ) from exc

          if len(decoded) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small; check the secret value.")

          target = Path("android/app/geosnap-release.jks")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(decoded)
          print(f"Release keystore decoded successfully ({len(decoded)} bytes).")
          PY

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build signed APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/geosnap-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          echo "Release APK exists and signature verification command completed."

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: GeoSnap-Pro-Bazaar-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
