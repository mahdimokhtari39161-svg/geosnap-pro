name: Build GeoSnap Pro Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local web app files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#102b35' --splashBackgroundColor '#102b35'

      - name: Add camera and location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          entries = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />'
          ]

          for entry in entries:
              if entry not in content:
                  match = re.search(r"\\s*<application\\b", content)
                  if not match:
                      raise SystemExit("Could not find application tag")
                  content = content[:match.start()] + "\\n    " + entry + content[match.start():]

          manifest.write_text(content, encoding="utf-8")
          print("Camera and GPS permissions added.")
          PY

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/geosnap-release.jks
          test -s android/app/geosnap-release.jks

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build signed APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/geosnap-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          echo "Release APK exists and signature verification command completed."

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: GeoSnap-Pro-Bazaar-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
